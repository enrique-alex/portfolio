name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Validation & Tests (Vitest, TSC, Lint)
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout du code
        uses: actions/checkout@v5

      # 2. Configuration de l'environnement Node.js (LTS 22)
      - name: Configuration de Node.js 22 (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      # 3. Installation stricte et reproductible des dépendances
      - name: Installation des dépendances (npm ci)
        run: npm ci

      # 4. Vérification du style de code et des règles ESLint (0 erreur)
      - name: Validation ESLint (lint)
        run: npm run lint

      # 5. Vérification de typage statique TypeScript (zéro erreur tolérée)
      - name: Vérification TypeScript (tsc)
        run: npx tsc --noEmit

      # 6. Exécution de la suite complète de tests Vitest + D1 isolé (workerd)
      - name: Exécution des tests (Vitest)
        run: npm test

  deploy:
    name: Déploiement Production (Cloudflare D1 & Worker)
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout du code
        uses: actions/checkout@v5

      # 2. Configuration de l'environnement Node.js (LTS 22)
      - name: Configuration de Node.js 22 (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      # 3. Installation des dépendances
      - name: Installation des dépendances (npm ci)
        run: npm ci

      # 4. Application des migrations D1 distantes
      - name: Application des migrations D1 (portfolio-db)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply portfolio-db --remote

      # 5. Build et Déploiement Cloudflare OpenNext
      - name: Build et Déploiement Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://portfolio.enriquekemayou.workers.dev
        run: npm run deploy
