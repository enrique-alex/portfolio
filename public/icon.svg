<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Balanced high-contrast dark container badge for crisp 16x16 and 32x32 display -->
  <rect width="32" height="32" rx="6" fill="#050505" />
  
  <!-- Official Monogram EN: 45° & 90° PCB geometric routing with pixel-aligned uniform stroke -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- E outer frame: bottom bar -> spine -> top bar -->
    <path d="M16 24H8V8h8" />
    <!-- E middle bus trace to central junction (16, 16) -->
    <path d="M8 16h8" />
    <!-- N 45° diagonal trace and right vertical stem -->
    <path d="M8 8l16 16V8" />
  </g>
</svg>
